server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blogdb}
    username: ${DATABASE_USERNAME:MOUAD}
    password: ${DATABASE_PASSWORD:mmm}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    # show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Custom JWT and File Storage Properties
blog:
  app:
    jwtSecret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  upload:
    path: ${UPLOAD_PATH:./uploads}
